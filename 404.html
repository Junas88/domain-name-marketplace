<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domain Name Guide</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      background-color: #f8f9fa;
      color: #333;
    }
    .container {
      max-width: 800px;
      padding: 2rem;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h1 {
      margin-bottom: 1rem;
      font-size: 2.5rem;
    }
    p {
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }
    a {
      color: #0070f3;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .cta {
      display: inline-block;
      background-color: #0070f3;
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 4px;
      font-weight: 500;
      margin-top: 1rem;
    }
    .cta:hover {
      background-color: #0051a8;
      text-decoration: none;
    }
  </style>
  <!-- Script to redirect to the React app -->
  <script>
    window.onload = function() {
      // Redirect to the homepage after a brief delay
      setTimeout(function() {
        window.location.href = '/';
      }, 100);
    }
  </script>
</head>
<body>
  <div class="container">
    <h1>Domain Name Guide</h1>
    <p>The comprehensive marketplace for premium domain names.</p>
    <p>If you're not redirected automatically, please click the button below:</p>
    <a href="/" class="cta">Go to Homepage</a>
  </div>
</body>
</html>
