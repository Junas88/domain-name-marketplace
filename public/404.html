<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>DOMAIN NAME GUIDE - Redirecting...</title>
  <script>
    // Handles SPA routing in production environments
    (function() {
      // Get the current path from the URL
      var path = window.location.pathname;
      
      // Check if this is an admin/dashboard path
      var isAdminPath = path.includes('/admin') || 
                        path.includes('/dashboard') || 
                        path.match(/^\/[^\/]+\/(admin|dashboard)/);
      
      if (isAdminPath) {
        // Special handling for admin paths - go directly to /admin
        window.location.href = '/admin';
      } else {
        // For all other paths, preserve them in a redirect parameter
        // This allows the SPA router to handle the path once loaded
        var redirectUrl = '/?redirectFrom=' + encodeURIComponent(path);
        
        // Add any query parameters
        if (window.location.search) {
          redirectUrl += '&' + window.location.search.substring(1);
        }
        
        // Add any hash
        if (window.location.hash) {
          redirectUrl += window.location.hash;
        }
        
        // Perform the redirect
        window.location.replace(redirectUrl);
      }
    })();
  </script>
</head>
<body>
  <h2>Redirecting...</h2>
  <p>If you are not redirected automatically, <a href="/">click here</a>.</p>
</body>
</html>
