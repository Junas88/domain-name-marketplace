<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>DOMAIN NAME GUIDE - Redirecting...</title>
  <script>
    // Ultra simplified SPA routing with fallback
    (function() {
      // Constants
      var ADMIN_PATH = '/admin';
      var FALLBACK_PATH = '/admin-fallback';
      var MAX_FAILURES = 2;
      
      // Simple persistent state management
      function getFailureCount() {
        return parseInt(localStorage.getItem('adminFailures') || '0', 10);
      }
      
      function incrementFailureCount() {
        var count = getFailureCount() + 1;
        localStorage.setItem('adminFailures', count.toString());
        return count;
      }
      
      // Get current path
      var path = window.location.pathname;
      
      // Super simple admin path detection for maximum compatibility
      if (path.indexOf('admin') !== -1 || path.indexOf('dashboard') !== -1) {
        // Check failure count for admin paths
        var failures = getFailureCount();
        
        if (failures >= MAX_FAILURES) {
          // Too many failures, use fallback path
          window.location.href = FALLBACK_PATH;
        } else {
          // Increment failure count and try normal admin
          incrementFailureCount();
          window.location.href = ADMIN_PATH;
        }
      } else {
        // For all other paths, use root with redirect parameter
        var redirect = '/?redirectFrom=' + encodeURIComponent(path);
        
        // Add any query parameters
        if (window.location.search) {
          redirect += '&' + window.location.search.substring(1);
        }
        
        // Simple and direct redirect
        window.location.href = redirect;
      }
    })();
  </script>
</head>
<body style="font-family: system-ui, sans-serif; text-align: center; padding: 20px;">
  <h2>Redirecting...</h2>
  <p>If you are not redirected automatically, <a href="/">click here</a>.</p>
  <p>For admin access, try the <a href="/admin-fallback">backup admin page</a>.</p>
</body>
</html>
