<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - Domain Name Guide</title>
  <!-- This is a direct entry point for the admin dashboard -->
  <script>
    // Verify the user is logged in by checking for admin cookie/session
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        // Check if the user is authenticated
        const response = await fetch('/api/auth/user');
        if (response.ok) {
          const user = await response.json();
          
          if (user && user.isAdmin) {
            // User is authenticated and is admin, load the admin dashboard
            window.location.href = '/admin-dashboard.html';
            return;
          }
        }
        
        // User is not authenticated or not admin, redirect to login
        window.location.href = '/auth';
      } catch (error) {
        console.error('Error checking authentication:', error);
        // On error, redirect to login page
        window.location.href = '/auth';
      }
    });
  </script>
</head>
<body>
  <div style="display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif;">
    <div style="text-align: center;">
      <div style="border: 4px solid #000; width: 40px; height: 40px; border-radius: 50%; border-top-color: transparent; animation: spin 1s linear infinite; margin: 0 auto;"></div>
      <p style="margin-top: 20px; font-size: 18px;">Verifying admin access...</p>
    </div>
  </div>
  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #f8f8f8;
    }
  </style>
</body>
</html>
